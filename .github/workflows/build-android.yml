name: Build Android Scanner Test App

on:
  push:
    branches: [main, feat/android-scanner-test-app]
    paths: ['android_app/**', '.github/workflows/build-android.yml']
  pull_request:
    branches: [main]
    paths: ['android_app/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: android_app

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hp-m175-scan-test-debug
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
